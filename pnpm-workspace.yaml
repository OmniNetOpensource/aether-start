packages:
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@dom-expressions/compiler-darwin-arm64@0.50.0-next.37'
  - '@dom-expressions/compiler-darwin-x64@0.50.0-next.37'
  - '@dom-expressions/compiler-linux-arm64-gnu@0.50.0-next.37'
  - '@dom-expressions/compiler-linux-x64-gnu@0.50.0-next.37'
  - '@dom-expressions/compiler-wasm32-wasi@0.50.0-next.37'
  - '@dom-expressions/compiler-win32-x64-msvc@0.50.0-next.37'
  - '@dom-expressions/compiler@0.50.0-next.37'
  - '@solidjs/signals@2.0.0-beta.31'
  - '@solidjs/web@2.0.0-beta.31'
  - solid-js@2.0.0-beta.31
  - vite-plugin-solid@3.0.0-next.22
